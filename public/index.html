<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Primordial — a living world</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='13' cy='16' r='8' fill='%2346e0a8'/%3E%3Ccircle cx='22' cy='11' r='4' fill='%23eac36a'/%3E%3Ccircle cx='23' cy='21' r='3' fill='%23ff6b6b'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <!-- ░░ HEADER ░░ -->
    <header id="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span class="cell c1"></span><span class="cell c2"></span><span class="cell c3"></span>
        </div>
        <div class="brand-text">
          <h1>PRIMORDIAL</h1>
          <p>a living world · evolution in real time</p>
        </div>
      </div>
      <div class="readouts">
        <div class="stat"><span class="k">time</span><span class="v" id="stat-time">0:00</span></div>
        <div class="stat"><span class="k">creatures</span><span class="v" id="stat-pop">0</span></div>
        <div class="stat"><span class="k">generation</span><span class="v" id="stat-gen">0</span></div>
        <div class="stat"><span class="k">fps</span><span class="v" id="stat-fps">–</span></div>
      </div>
    </header>

    <!-- ░░ LEFT: controls + charts ░░ -->
    <aside id="left">
      <section class="panel">
        <h2 class="panel-title">Controls</h2>
        <div class="transport">
          <button id="btn-play" class="btn primary" title="Play / Pause (space)">
            <span class="ico-pause">❚❚</span><span class="ico-play">▶</span>
          </button>
          <div class="speed">
            <label for="speed">speed</label>
            <input id="speed" type="range" min="1" max="10" step="1" value="2" />
            <span id="speed-val" class="speed-val">2×</span>
          </div>
        </div>
        <div class="god">
          <div class="god-label">God mode</div>
          <div class="god-buttons">
            <button id="btn-meteor" class="btn god meteor" title="Kill ~70% of all life">☄ Meteor</button>
            <button id="btn-famine" class="btn god famine" title="Halve the food supply">✷ Famine</button>
            <button id="btn-abundance" class="btn god abundance" title="Double the food supply">✿ Abundance</button>
          </div>
          <button id="btn-reset" class="btn ghost" title="Reseed a fresh world">↻ New world</button>
        </div>
      </section>

      <section class="panel">
        <h2 class="panel-title">Population by species</h2>
        <canvas id="chart-pop" class="chart"></canvas>
        <div class="legend">
          <span><i class="dot grazer"></i>grazers</span>
          <span><i class="dot omnivore"></i>omnivores</span>
          <span><i class="dot hunter"></i>hunters</span>
        </div>
      </section>

      <section class="panel">
        <h2 class="panel-title">Average traits over generations</h2>
        <canvas id="chart-traits" class="chart"></canvas>
        <div class="legend small" id="trait-legend"></div>
      </section>
    </aside>

    <!-- ░░ CENTER: the world ░░ -->
    <main id="stage">
      <canvas id="world"></canvas>
      <div id="toasts"></div>
      <div id="banner" class="banner hidden"></div>
    </main>

    <!-- ░░ RIGHT: field notes + inspector ░░ -->
    <aside id="right">
      <section class="panel notes-panel">
        <h2 class="panel-title">
          Field Notes
          <span id="narrator-badge" class="badge">connecting…</span>
        </h2>
        <div id="field-notes" class="field-notes"></div>
      </section>

      <section class="panel inspector-panel">
        <h2 class="panel-title">Specimen</h2>
        <div id="inspector" class="inspector empty">
          <p class="hint">Click any creature to read its genome and lineage.</p>
        </div>
      </section>
    </aside>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
